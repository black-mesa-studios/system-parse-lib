[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "system-parse-lib"
version = "0.0.3"
authors = [
    { name="Artem Ivashyn", email="artem4ik15082013@gmail.com" },
]
description = "A for now small python library used for getting information about the system and hardware on linux. Dependency free! (well, not really)"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/black-mesa-studios/system-parse-lib"
Issues = "https://github.com/black-mesa-studios/system-parse-lib/issues/"

[tool.hatch.build.targets.wheel]
packages = ["src/systemparselib"]